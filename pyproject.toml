[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantimate"
version = "8.5.0"
description = "QuantiMate TDK — Moduláris kvantitatív pénzügyi idősor-elemző és valószínűségi előrejelző rendszer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.5.1",
    "pandas==3.0.3",
    "requests==2.34.2",
    "matplotlib==3.11.0",
    "seaborn==0.13.2",
    "scipy==1.18.0",
    "statsmodels==0.14.6",
    "arch==8.0.0",
    "hmmlearn==0.3.3",
    "scikit-learn==1.9.0",
    "tensorflow==2.21.0",
    "python-dotenv==1.2.2",
    "google-genai==2.10.0",
    "pyarrow==24.0.0",
    "lightgbm==4.6.0",
    "ipykernel==7.3.0",
    "nbformat==5.10.4",
    "nbclient==0.11.0",
    "nbconvert==7.17.1",
    "papermill==2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]
deep-nlp = [
    "torch==2.12.1",
    "transformers==5.13.0",
    "chronos-forecasting==2.3.1",
]

[project.scripts]
quantimate-experiments = "quantimate.experiment_runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quantimate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
